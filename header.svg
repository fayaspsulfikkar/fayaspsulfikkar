<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="100%" height="100%">
  <defs>
    <!-- ================= NEUMORPHIC DUAL SHADOW FILTERS (GITHUB DARK) ================= -->
    <!-- Extruded Card Filter: Dark Shadow on bottom-right, Subtle Highlight on top-left -->
    <filter id="neu-card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur1"/>
      <feOffset in="blur1" dx="8" dy="8" result="offsetDark"/>
      <feFlood flood-color="#010409" flood-opacity="0.9" result="colorDark"/>
      <feComposite in="colorDark" in2="offsetDark" operator="in" result="shadowDark"/>

      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur2"/>
      <feOffset in="blur2" dx="-6" dy="-6" result="offsetLight"/>
      <feFlood flood-color="#30363d" flood-opacity="0.45" result="colorLight"/>
      <feComposite in="colorLight" in2="offsetLight" operator="in" result="shadowLight"/>

      <feMerge>
        <feMergeNode in="shadowDark"/>
        <feMergeNode in="shadowLight"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Extruded Pill Filter -->
    <filter id="neu-pill-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur1"/>
      <feOffset in="blur1" dx="4" dy="4" result="offsetDark"/>
      <feFlood flood-color="#010409" flood-opacity="0.8" result="colorDark"/>
      <feComposite in="colorDark" in2="offsetDark" operator="in" result="shadowDark"/>

      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur2"/>
      <feOffset in="blur2" dx="-3" dy="-3" result="offsetLight"/>
      <feFlood flood-color="#30363d" flood-opacity="0.5" result="colorLight"/>
      <feComposite in="colorLight" in2="offsetLight" operator="in" result="shadowLight"/>

      <feMerge>
        <feMergeNode in="shadowDark"/>
        <feMergeNode in="shadowLight"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle Ambient Glow Behind Card -->
    <filter id="ambient-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="50" result="blur"/>
    </filter>

    <!-- ================= GITHUB PALETTE GRADIENTS ================= -->
    <!-- GitHub Dark Card Surface Gradient (Convex Neumorphic) -->
    <linearGradient id="ghCardSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2128"/>
      <stop offset="100%" stop-color="#14181f"/>
    </linearGradient>

    <!-- GitHub Inset Well Surface (Debossed Neumorphic) -->
    <linearGradient id="ghWellSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#0e1219"/>
    </linearGradient>

    <!-- GitHub Pill Surface -->
    <linearGradient id="ghPillSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e232b"/>
      <stop offset="100%" stop-color="#14181f"/>
    </linearGradient>

    <!-- Title Gradient using GitHub Blue & White -->
    <linearGradient id="ghTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#e6edf3"/>
      <stop offset="85%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>

    <!-- Ambient Glow Blobs in GitHub Colors -->
    <radialGradient id="ghBlueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ghPurpleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bc8cff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ghGreenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>

    <!-- Sheen Beam Gradient -->
    <linearGradient id="ghSheenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="wellClip">
      <rect x="0" y="0" width="960" height="118" rx="20"/>
    </clipPath>

    <!-- ================= SUBTLE AMBIENT ANIMATIONS ================= -->
    <style>
      @keyframes ambientDrift1 {
        0% { transform: translate(0px, 0px); opacity: 0.7; }
        50% { transform: translate(70px, 30px); opacity: 1; }
        100% { transform: translate(0px, 0px); opacity: 0.7; }
      }
      @keyframes ambientDrift2 {
        0% { transform: translate(0px, 0px); opacity: 0.6; }
        50% { transform: translate(-60px, -25px); opacity: 0.95; }
        100% { transform: translate(0px, 0px); opacity: 0.6; }
      }
      @keyframes pulseLed {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }
      @keyframes sheenPass {
        0% { transform: translateX(-400px) skewX(-20deg); }
        35% { transform: translateX(1100px) skewX(-20deg); }
        100% { transform: translateX(1100px) skewX(-20deg); }
      }

      .glow-1 {
        animation: ambientDrift1 14s ease-in-out infinite alternate;
      }
      .glow-2 {
        animation: ambientDrift2 16s ease-in-out infinite alternate;
      }
      .led-indicator {
        animation: pulseLed 2.2s ease-in-out infinite;
        transform-origin: 87px 62px;
      }
      .sheen-anim {
        animation: sheenPass 8s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Canvas Background matching GitHub Dark Mode #0d1117 -->
  <rect width="1200" height="450" fill="#0d1117"/>

  <!-- ================= SUBTLE BACKGROUND AMBIENT RADIANCE ================= -->
  <g filter="url(#ambient-blur)">
    <!-- GitHub Blue Glow (Top-Left) -->
    <ellipse cx="250" cy="120" rx="260" ry="160" fill="url(#ghBlueGlow)" class="glow-1"/>
    <!-- GitHub Purple Glow (Right) -->
    <ellipse cx="950" cy="240" rx="280" ry="180" fill="url(#ghPurpleGlow)" class="glow-2"/>
    <!-- GitHub Green Glow (Bottom-Center) -->
    <ellipse cx="600" cy="380" rx="240" ry="130" fill="url(#ghGreenGlow)"/>
  </g>

  <!-- ================= MAIN EXTRUDED NEUMORPHIC CARD ================= -->
  <!-- Surface: GitHub Subtle #161b22 with physical dual shadows -->
  <rect x="36" y="26" width="1128" height="398" rx="26" fill="url(#ghCardSurface)" filter="url(#neu-card-shadow)" stroke="#30363d" stroke-width="0.8" stroke-opacity="0.6"/>

  <!-- Specular Top Rim Highlight (Emboss Bevel) -->
  <path d="M 64 27 L 1136 27" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.12" stroke-linecap="round"/>

  <!-- ================= TOP HUD TELEMETRY PILLS ================= -->
  <!-- Left Status Pill -->
  <g transform="translate(68, 48)">
    <rect x="0" y="0" width="158" height="34" rx="17" fill="url(#ghPillSurface)" filter="url(#neu-pill-shadow)" stroke="#30363d" stroke-width="0.75"/>
    <!-- GitHub Green LED -->
    <circle cx="19" cy="17" r="7" fill="#3fb950" fill-opacity="0.25" class="led-indicator"/>
    <circle cx="19" cy="17" r="4" fill="#3fb950" class="led-indicator"/>
    <text x="34" y="21.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#3fb950" letter-spacing="1.2">SYSTEM ONLINE</text>
  </g>

  <!-- Right Location & Hub Pill -->
  <g transform="translate(936, 48)">
    <rect x="0" y="0" width="196" height="34" rx="17" fill="url(#ghPillSurface)" filter="url(#neu-pill-shadow)" stroke="#30363d" stroke-width="0.75"/>
    <text x="98" y="21.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8b949e" letter-spacing="0.8">
      📍 CALICUT &#160;•&#160; BROTOTYPE
    </text>
  </g>

  <!-- ================= HERO NAME & TITLE ================= -->
  <text x="600" y="132" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="url(#ghTitleGrad)" letter-spacing="3">
    FAYAS P SULFIKKAR
  </text>

  <text x="600" y="162" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#8b949e" letter-spacing="2">
    AI / ML ENGINEER &#160;•&#160; SYSTEMS RESEARCHER &#160;•&#160; INDEPENDENT BUILDER
  </text>

  <!-- ================= CENTERPIECE: DEBOSSED / SUNKEN NEUMORPHIC WELL ================= -->
  <!-- The well is physically pressed INTO the #161b22 surface -->
  <g transform="translate(120, 186)">
    <!-- Sunken Surface -->
    <rect x="0" y="0" width="960" height="118" rx="20" fill="url(#ghWellSurface)" stroke="#010409" stroke-width="2"/>

    <!-- Inset Top-Left Dark Shadow (Debossed Depth) -->
    <path d="M 2 20 L 2 2 Q 2 2 20 2 L 940 2" fill="none" stroke="#010409" stroke-width="3" opacity="0.95"/>
    <path d="M 4 22 L 4 4 Q 4 4 22 4 L 938 4" fill="none" stroke="#010409" stroke-width="2" opacity="0.7"/>

    <!-- Inset Bottom-Right Light Rim (Debossed Highlight) -->
    <path d="M 958 98 L 958 116 Q 958 116 940 116 L 20 116" fill="none" stroke="#30363d" stroke-width="1.5" opacity="0.6"/>

    <!-- Subtle Specular Sheen Pass -->
    <g clip-path="url(#wellClip)">
      <rect x="0" y="0" width="180" height="118" fill="url(#ghSheenGrad)" class="sheen-anim"/>
    </g>

    <!-- User's Exact Signature Bio in GitHub Dark Palette -->
    <text x="480" y="44" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" letter-spacing="0.4">
      📉 𝗚𝗿𝗮𝗱𝗶𝗲𝗻𝘁 𝗱𝗲𝘀𝗰𝗲𝗻𝘁 ᴏɴ ᴍʏ ʟɪғᴇ ᴄʜᴏɪᴄᴇs.
    </text>

    <text x="480" y="73" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#c9d1d9" letter-spacing="0.4">
      🎓 ᴀɪ/ᴍʟ sᴛᴜᴅᴇɴᴛ, sᴛɪʟʟ ᴄᴏɴᴠᴇʀɢɪɴɢ.
    </text>

    <text x="480" y="101" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#8b949e" letter-spacing="0.4">
      ☕ ᴏᴠᴇʀғɪᴛᴛɪɴɢ ᴏɴ ᴄᴀғғᴇɪɴᴇ, ᴜɴᴅᴇʀғɪᴛᴛɪɴɢ ᴏɴ sʟᴇᴇᴘ. 😴
    </text>
  </g>

  <!-- ================= BOTTOM FOUR EXTRUDED NEUMORPHIC PILLS ================= -->
  <g transform="translate(600, 338)">
    <!-- Pill 1: Brain Encoding (GitHub Blue) -->
    <g transform="translate(-465, 0)">
      <rect x="0" y="0" width="220" height="42" rx="21" fill="url(#ghPillSurface)" filter="url(#neu-pill-shadow)" stroke="#30363d" stroke-width="0.75"/>
      <text x="110" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#58a6ff">
        🧠 Brain Encoding (TRIBE)
      </text>
    </g>

    <!-- Pill 2: Vision WASM (GitHub Purple) -->
    <g transform="translate(-230, 0)">
      <rect x="0" y="0" width="220" height="42" rx="21" fill="url(#ghPillSurface)" filter="url(#neu-pill-shadow)" stroke="#30363d" stroke-width="0.75"/>
      <text x="110" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#bc8cff">
        👁️ Vision WASM (MediaPipe)
      </text>
    </g>

    <!-- Pill 3: BLE Protocol (GitHub Green) -->
    <g transform="translate(10, 0)">
      <rect x="0" y="0" width="220" height="42" rx="21" fill="url(#ghPillSurface)" filter="url(#neu-pill-shadow)" stroke="#30363d" stroke-width="0.75"/>
      <text x="110" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#3fb950">
        ⚡ BLE Reverse Engineering
      </text>
    </g>

    <!-- Pill 4: Math ML (GitHub Amber) -->
    <g transform="translate(245, 0)">
      <rect x="0" y="0" width="220" height="42" rx="21" fill="url(#ghPillSurface)" filter="url(#neu-pill-shadow)" stroke="#30363d" stroke-width="0.75"/>
      <text x="110" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#d29922">
        📉 Mathematical ML Rigor
      </text>
    </g>
  </g>

  <!-- ================= SUBTLE BOTTOM PHILOSOPHY ================= -->
  <text x="600" y="408" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8b949e" letter-spacing="2">
    LEARN &#160;•&#160; BUILD &#160;•&#160; FAIL &#160;•&#160; REPEAT &#160;&#160;—&#160;&#160; &quot;MEANING MUST BE BUILT.&quot;
  </text>
</svg>