<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="100%" height="100%">
  <defs>
    <!-- Neumorphic Dual Shadows (GitHub Dark) -->
    <filter id="neu-card-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur1"/>
      <feOffset in="blur1" dx="5" dy="5" result="offsetDark"/>
      <feFlood flood-color="#010409" flood-opacity="0.9" result="colorDark"/>
      <feComposite in="colorDark" in2="offsetDark" operator="in" result="shadowDark"/>

      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur2"/>
      <feOffset in="blur2" dx="-4" dy="-4" result="offsetLight"/>
      <feFlood flood-color="#30363d" flood-opacity="0.45" result="colorLight"/>
      <feComposite in="colorLight" in2="offsetLight" operator="in" result="shadowLight"/>

      <feMerge>
        <feMergeNode in="shadowDark"/>
        <feMergeNode in="shadowLight"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neu-pill-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur1"/>
      <feOffset in="blur1" dx="2.5" dy="2.5" result="offsetDark"/>
      <feFlood flood-color="#010409" flood-opacity="0.8" result="colorDark"/>
      <feComposite in="colorDark" in2="offsetDark" operator="in" result="shadowDark"/>

      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="blur2"/>
      <feOffset in="blur2" dx="-2" dy="-2" result="offsetLight"/>
      <feFlood flood-color="#30363d" flood-opacity="0.5" result="colorLight"/>
      <feComposite in="colorLight" in2="offsetLight" operator="in" result="shadowLight"/>

      <feMerge>
        <feMergeNode in="shadowDark"/>
        <feMergeNode in="shadowLight"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="ambient-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40" result="blur"/>
    </filter>

    <!-- GitHub Palette Gradients -->
    <linearGradient id="ghCardSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2128"/>
      <stop offset="100%" stop-color="#14181f"/>
    </linearGradient>

    <linearGradient id="ghWellSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#0e1219"/>
    </linearGradient>

    <linearGradient id="ghPillSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e232b"/>
      <stop offset="100%" stop-color="#14181f"/>
    </linearGradient>

    <linearGradient id="ghTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e6edf3"/>
      <stop offset="80%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>

    <radialGradient id="ghBlueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ghPurpleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bc8cff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ghGreenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ghSheenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="wellClip">
      <rect x="0" y="0" width="800" height="88" rx="14"/>
    </clipPath>

    <style>
      @keyframes ambientDrift1 {
        0% { transform: translate(0px, 0px); opacity: 0.7; }
        50% { transform: translate(50px, 20px); opacity: 1; }
        100% { transform: translate(0px, 0px); opacity: 0.7; }
      }
      @keyframes ambientDrift2 {
        0% { transform: translate(0px, 0px); opacity: 0.6; }
        50% { transform: translate(-40px, -15px); opacity: 0.95; }
        100% { transform: translate(0px, 0px); opacity: 0.6; }
      }
      @keyframes pulseLed {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }
      @keyframes sheenPass {
        0% { transform: translateX(-300px) skewX(-20deg); }
        35% { transform: translateX(900px) skewX(-20deg); }
        100% { transform: translateX(900px) skewX(-20deg); }
      }

      .glow-1 {
        animation: ambientDrift1 14s ease-in-out infinite alternate;
      }
      .glow-2 {
        animation: ambientDrift2 16s ease-in-out infinite alternate;
      }
      .led-indicator {
        animation: pulseLed 2.2s ease-in-out infinite;
        transform-origin: 56px 45px;
      }
      .sheen-anim {
        animation: sheenPass 7.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- GitHub Dark Canvas -->
  <rect width="880" height="280" fill="#0d1117"/>

  <!-- Subtle Radiance -->
  <g filter="url(#ambient-blur)">
    <ellipse cx="200" cy="90" rx="200" ry="110" fill="url(#ghBlueGlow)" class="glow-1"/>
    <ellipse cx="700" cy="170" rx="220" ry="120" fill="url(#ghPurpleGlow)" class="glow-2"/>
    <ellipse cx="440" cy="240" rx="180" ry="80" fill="url(#ghGreenGlow)"/>
  </g>

  <!-- Main Extruded Neumorphic Card -->
  <rect x="16" y="14" width="848" height="252" rx="18" fill="url(#ghCardSurface)" filter="url(#neu-card-shadow)" stroke="#30363d" stroke-width="1"/>

  <!-- Specular Top Rim Highlight -->
  <path d="M 36 15 L 844 15" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.15" stroke-linecap="round"/>

  <!-- Top HUD Telemetry -->
  <g transform="translate(38, 31)">
    <rect x="0" y="0" width="138" height="28" rx="14" fill="url(#ghPillSurface)" filter="url(#neu-pill-shadow)" stroke="#30363d" stroke-width="0.75"/>
    <circle cx="18" cy="14" r="6" fill="#3fb950" fill-opacity="0.25" class="led-indicator"/>
    <circle cx="18" cy="14" r="3.5" fill="#3fb950" class="led-indicator"/>
    <text x="32" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="10" font-weight="700" fill="#3fb950" letter-spacing="1.1">SYSTEM ONLINE</text>
  </g>

  <g transform="translate(674, 31)">
    <rect x="0" y="0" width="168" height="28" rx="14" fill="url(#ghPillSurface)" filter="url(#neu-pill-shadow)" stroke="#30363d" stroke-width="0.75"/>
    <text x="84" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="10" font-weight="600" fill="#8b949e" letter-spacing="0.8">
      📍 CALICUT &#160;•&#160; BROTOTYPE
    </text>
  </g>

  <!-- Hero Name & Title -->
  <text x="440" y="56" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="28" font-weight="800" fill="url(#ghTitleGrad)" letter-spacing="2.5">
    FAYAS P SULFIKKAR
  </text>
  <text x="440" y="78" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="10.5" font-weight="600" fill="#8b949e" letter-spacing="1.5">
    AI / ML ENGINEER &#160;•&#160; SYSTEMS RESEARCHER &#160;•&#160; INDEPENDENT BUILDER
  </text>

  <!-- Centerpiece: Debossed Neumorphic Well for Signature Bio -->
  <g transform="translate(40, 96)">
    <rect x="0" y="0" width="800" height="88" rx="14" fill="url(#ghWellSurface)" stroke="#010409" stroke-width="2"/>

    <!-- Inset Top-Left Dark Shadow -->
    <path d="M 2 16 L 2 2 Q 2 2 16 2 L 784 2" fill="none" stroke="#010409" stroke-width="2.5" opacity="0.95"/>
    <!-- Inset Bottom-Right Light Rim -->
    <path d="M 798 72 L 798 86 Q 798 86 784 86 L 16 86" fill="none" stroke="#30363d" stroke-width="1.2" opacity="0.6"/>

    <!-- Sheen Pass -->
    <g clip-path="url(#wellClip)">
      <rect x="0" y="0" width="150" height="88" fill="url(#ghSheenGrad)" class="sheen-anim"/>
    </g>

    <!-- Signature Bio Lines -->
    <text x="400" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#f0f6fc" letter-spacing="0.3">
      📉 𝗚𝗿𝗮𝗱𝗶𝗲𝗻𝘁 𝗱𝗲𝘀𝗰𝗲𝗻𝘁 ᴏɴ ᴍʏ ʟɪғᴇ ᴄʜᴏɪᴄᴇs.
    </text>
    <text x="400" y="51" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#c9d1d9" letter-spacing="0.3">
      🎓 ᴀɪ/ᴍʟ sᴛᴜᴅᴇɴᴛ, sᴛɪʟʟ ᴄᴏɴᴠᴇʀɢɪɴɢ.
    </text>
    <text x="400" y="74" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#8b949e" letter-spacing="0.3">
      ☕ ᴏᴠᴇʀғɪᴛᴛɪɴɢ ᴏɴ ᴄᴀғғᴇɪɴᴇ, ᴜɴᴅᴇʀғɪᴛᴛɪɴɢ ᴏɴ sʟᴇᴇᴘ. 😴
    </text>
  </g>

  <!-- Bottom Four Neumorphic Pills -->
  <g transform="translate(40, 202)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="190" height="32" rx="16" fill="url(#ghPillSurface)" filter="url(#neu-pill-shadow)" stroke="#30363d" stroke-width="0.75"/>
      <text x="95" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#58a6ff">
        🧠 Brain Encoding (TRIBE)
      </text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(203, 0)">
      <rect x="0" y="0" width="190" height="32" rx="16" fill="url(#ghPillSurface)" filter="url(#neu-pill-shadow)" stroke="#30363d" stroke-width="0.75"/>
      <text x="95" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#bc8cff">
        👁️ Vision WASM (MediaPipe)
      </text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(407, 0)">
      <rect x="0" y="0" width="190" height="32" rx="16" fill="url(#ghPillSurface)" filter="url(#neu-pill-shadow)" stroke="#30363d" stroke-width="0.75"/>
      <text x="95" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#3fb950">
        ⚡ BLE Reverse Engineering
      </text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(610, 0)">
      <rect x="0" y="0" width="190" height="32" rx="16" fill="url(#ghPillSurface)" filter="url(#neu-pill-shadow)" stroke="#30363d" stroke-width="0.75"/>
      <text x="95" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#d29922">
        📉 Mathematical ML Rigor
      </text>
    </g>
  </g>

  <!-- Bottom Subtitle / Philosophy -->
  <text x="440" y="253" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="600" fill="#8b949e" letter-spacing="1.5">
    LEARN &#160;•&#160; BUILD &#160;•&#160; FAIL &#160;•&#160; REPEAT &#160;&#160;—&#160;&#160; &quot;MEANING MUST BE BUILT.&quot;
  </text>
</svg>