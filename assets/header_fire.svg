<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="100%" height="100%">
  <defs>
    <!-- Soft Ambient Fire Glow Filters -->
    <filter id="ambient-fire-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40" result="blur"/>
    </filter>

    <filter id="text-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.5" result="blur"/>
      <feFlood flood-color="#ff5500" flood-opacity="0.35" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Glowing Flame Title Gradient -->
    <linearGradient id="fireTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#ffebaa"/>
      <stop offset="60%" stop-color="#ffa726"/>
      <stop offset="85%" stop-color="#ff7043"/>
      <stop offset="100%" stop-color="#ff3d00"/>
    </linearGradient>

    <!-- Soft Ember Gradient Divider -->
    <linearGradient id="fireDividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5500" stop-opacity="0"/>
      <stop offset="25%" stop-color="#ff7043" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#ffa726" stop-opacity="0.75"/>
      <stop offset="75%" stop-color="#ff7043" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff5500" stop-opacity="0"/>
    </linearGradient>

    <!-- Transparent Pill Surface -->
    <linearGradient id="pillTransGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7043" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ff3d00" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Ember Ambient Radiance Glows -->
    <radialGradient id="fireAmbientCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff5500" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#ff7043" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ff5500" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="fireAmbientRight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffa726" stop-opacity="0.16"/>
      <stop offset="70%" stop-color="#ffa726" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#ffa726" stop-opacity="0"/>
    </radialGradient>

    <style>
      @keyframes flamePulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.85); }
      }
      @keyframes ambientFloat {
        0% { transform: translateY(0px); opacity: 0.8; }
        50% { transform: translateY(-8px); opacity: 1; }
        100% { transform: translateY(0px); opacity: 0.8; }
      }
      .flame-indicator {
        animation: flamePulse 2.2s ease-in-out infinite;
        transform-origin: 18px 14px;
      }
      .aura {
        animation: ambientFloat 8s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- ZERO background rectangles: 100% transparent to blend with GitHub seamlessly -->

  <!-- Soft Floating Ambient Ember Auras -->
  <g filter="url(#ambient-fire-blur)" class="aura">
    <ellipse cx="440" cy="70" rx="260" ry="55" fill="url(#fireAmbientCenter)"/>
    <ellipse cx="440" cy="155" rx="280" ry="45" fill="url(#fireAmbientRight)"/>
  </g>

  <!-- Top Telemetry Row (Transparent Pills, No Hard Borders) -->
  <g transform="translate(60, 10)">
    <!-- Left Pill: Status -->
    <rect x="0" y="0" width="138" height="26" rx="13" fill="url(#pillTransGrad)"/>
    <circle cx="16" cy="13" r="5" fill="#ff5500" fill-opacity="0.3" class="flame-indicator"/>
    <circle cx="16" cy="13" r="3" fill="#ff7a00" class="flame-indicator"/>
    <text x="28" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#ff9800" letter-spacing="1.2">SYSTEM ONLINE</text>
  </g>

  <g transform="translate(650, 10)">
    <!-- Right Pill: Location -->
    <rect x="0" y="0" width="170" height="26" rx="13" fill="url(#pillTransGrad)"/>
    <text x="85" y="17" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#ffb74d" letter-spacing="0.8">
      📍 CALICUT &#160;•&#160; BROTOTYPE
    </text>
  </g>

  <!-- Hero Name: Glowing Incandescent Fire Typography -->
  <text x="440" y="66" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800" fill="url(#fireTitleGrad)" letter-spacing="3" filter="url(#text-glow)">
    FAYAS P SULFIKKAR
  </text>
  
  <!-- Profile Subtitle -->
  <text x="440" y="88" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#ffb74d" fill-opacity="0.88" letter-spacing="1.6">
    AI / ML STUDENT &amp; SYSTEMS RESEARCHER &#160;•&#160; INDEPENDENT BUILDER
  </text>

  <!-- Glowing Transparent Ember Divider -->
  <line x1="140" y1="102" x2="740" y2="102" stroke="url(#fireDividerGrad)" stroke-width="1.2"/>

  <!-- Signature First Impression Bio (Floating, No Borders, Seamless) -->
  <text x="440" y="130" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="0.3">
    📉 𝗚𝗿𝗮𝗱𝗶𝗲𝗻𝘁 𝗱𝗲𝘀𝗰𝗲𝗻𝘁 ᴏɴ ᴍʏ ʟɪғᴇ ᴄʜᴏɪᴄᴇs.
  </text>

  <text x="440" y="155" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#ffcc80" letter-spacing="0.3">
    🎓 ᴀɪ/ᴍʟ sᴛᴜᴅᴇɴᴛ, sᴛɪʟʟ ᴄᴏɴᴠᴇʀɢɪɴɢ.
  </text>

  <text x="440" y="180" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#ff8a50" letter-spacing="0.3">
    ☕ ᴏᴠᴇʀғɪᴛᴛɪɴɢ ᴏɴ ᴄᴀғғᴇɪɴᴇ, ᴜɴᴅᴇʀғɪᴛᴛɪɴɢ ᴏɴ sʟᴇᴇᴘ. 😴
  </text>

  <!-- Philosophy Subtitle -->
  <text x="440" y="206" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="500" fill="#d49b6a" fill-opacity="0.8" letter-spacing="1.2">
    Exploring intelligence &#160;•&#160; Understanding the mathematics &#160;•&#160; Building what's next
  </text>
</svg>
