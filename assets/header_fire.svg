<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="100%" height="100%">
  <defs>
    <!-- Soft Ambient Fire Glow Filter -->
    <filter id="ambient-fire-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
    </filter>

    <!-- Glowing Fire Text Filter -->
    <filter id="fireTextGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.5" result="blur"/>
      <feFlood flood-color="#ff4500" flood-opacity="0.4" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Top Gradient Blend: bridges pure video black (#000000) smoothly downward into transparency -->
    <linearGradient id="topVideoBlendGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="1"/>
      <stop offset="30%" stop-color="#000000" stop-opacity="0.85"/>
      <stop offset="65%" stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <!-- Glowing Flame Title Gradient -->
    <linearGradient id="fireTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#ffe082"/>
      <stop offset="55%" stop-color="#ffa726"/>
      <stop offset="85%" stop-color="#ff7043"/>
      <stop offset="100%" stop-color="#ff3d00"/>
    </linearGradient>

    <!-- Glowing Fire Divider Gradient -->
    <linearGradient id="fireDividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5500" stop-opacity="0"/>
      <stop offset="30%" stop-color="#ff7043" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#ffa726" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff5500" stop-opacity="0"/>
    </linearGradient>

    <!-- ASCII Terminal Pill Surface -->
    <linearGradient id="asciiPillSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7043" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ff3d00" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Ambient Radiance Behind Name -->
    <radialGradient id="fireAmbientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff5500" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#ff7043" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ff5500" stop-opacity="0"/>
    </radialGradient>

    <style>
      @keyframes flamePulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.85); }
      }
      @keyframes emberFloat {
        0% { transform: translateY(0px); opacity: 0.45; }
        50% { transform: translateY(-5px); opacity: 0.85; }
        100% { transform: translateY(0px); opacity: 0.45; }
      }
      .flame-indicator {
        animation: flamePulse 2.0s ease-in-out infinite;
        transform-origin: 16px 13px;
      }
      .ascii-embers {
        animation: emberFloat 5s ease-in-out infinite alternate;
      }
    </style>
  </defs>

  <!-- ═══════════════════════ TOP BLENDING GRADIENT ELEMENT ═══════════════════════ -->
  <!-- Blends from the video's black (#000000) smoothly into transparent background -->
  <rect x="0" y="0" width="880" height="70" fill="url(#topVideoBlendGrad)"/>

  <!-- Subtle ASCII Ember Drift in the transition zone -->
  <g class="ascii-embers" font-family="'Courier New', Courier, 'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="11" fill="#ffa726" fill-opacity="0.35">
    <text x="110" y="22">·</text>
    <text x="180" y="30">:</text>
    <text x="260" y="18">*</text>
    <text x="350" y="28">+</text>
    <text x="440" y="18">🔥</text>
    <text x="530" y="29">+</text>
    <text x="620" y="19">*</text>
    <text x="700" y="31">:</text>
    <text x="770" y="22">·</text>
  </g>

  <!-- Ambient Flame Radiance Behind Typography -->
  <g filter="url(#ambient-fire-blur)">
    <ellipse cx="440" cy="90" rx="280" ry="50" fill="url(#fireAmbientGlow)"/>
  </g>

  <!-- Top Telemetry Row (ASCII Terminal Pills) -->
  <g transform="translate(60, 26)">
    <rect x="0" y="0" width="160" height="26" rx="4" fill="url(#asciiPillSurface)" stroke="#ff7043" stroke-width="0.8" stroke-opacity="0.45"/>
    <circle cx="16" cy="13" r="5" fill="#ff5500" fill-opacity="0.3" class="flame-indicator"/>
    <circle cx="16" cy="13" r="3" fill="#ff7a00" class="flame-indicator"/>
    <text x="28" y="17" font-family="'Courier New', Courier, 'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="9.5" font-weight="700" fill="#ff9800" letter-spacing="1.2">[ SYSTEM // ONLINE ]</text>
  </g>

  <g transform="translate(635, 26)">
    <rect x="0" y="0" width="185" height="26" rx="4" fill="url(#asciiPillSurface)" stroke="#ff7043" stroke-width="0.8" stroke-opacity="0.45"/>
    <text x="92" y="17" text-anchor="middle" font-family="'Courier New', Courier, 'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="9.5" font-weight="700" fill="#ffb74d" letter-spacing="0.8">
      [ 📍 CALICUT // BROTOTYPE ]
    </text>
  </g>

  <!-- Hero Name: ASCII Monospace Fire Typography -->
  <text x="440" y="86" text-anchor="middle" font-family="'Courier New', Courier, 'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="31" font-weight="900" fill="url(#fireTitleGrad)" letter-spacing="4" filter="url(#fireTextGlow)">
    FAYAS P SULFIKKAR
  </text>
  
  <!-- Profile Subtitle in Terminal Code Style -->
  <text x="440" y="109" text-anchor="middle" font-family="'Courier New', Courier, 'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#ffb74d" fill-opacity="0.9" letter-spacing="1.8">
    // AI/ML STUDENT &amp; SYSTEMS RESEARCHER • INDEPENDENT BUILDER
  </text>

  <!-- ASCII / Fire Divider -->
  <line x1="120" y1="127" x2="370" y2="127" stroke="url(#fireDividerGrad)" stroke-width="1.2"/>
  <text x="440" y="131" text-anchor="middle" font-family="'Courier New', Courier, 'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="700" fill="#ffa726" letter-spacing="1.5">
    ⟢ EMBER ⟣
  </text>
  <line x1="510" y1="127" x2="760" y2="127" stroke="url(#fireDividerGrad)" stroke-width="1.2"/>

  <!-- Signature First Impression Bio (Monospace ASCII Fire Style) -->
  <text x="440" y="160" text-anchor="middle" font-family="'Courier New', Courier, 'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="0.5">
    📉 𝗚𝗿𝗮𝗱𝗶𝗲𝗻𝘁 𝗱𝗲𝘀𝗰𝗲𝗻𝘁 ᴏɴ ᴍʏ ʟɪғᴇ ᴄʜᴏɪᴄᴇs.
  </text>

  <text x="440" y="186" text-anchor="middle" font-family="'Courier New', Courier, 'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="15" font-weight="700" fill="#ffcc80" letter-spacing="0.5">
    🎓 ᴀɪ/ᴍʟ sᴛᴜᴅᴇɴᴛ, sᴛɪʟʟ ᴄᴏɴᴠᴇʀɢɪɴɢ.
  </text>

  <text x="440" y="212" text-anchor="middle" font-family="'Courier New', Courier, 'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="15" font-weight="700" fill="#ff8a50" letter-spacing="0.5">
    ☕ ᴏᴠᴇʀғɪᴛᴛɪɴɢ ᴏɴ ᴄᴀғғᴇɪɴᴇ, ᴜɴᴅᴇʀғɪᴛᴛɪɴɢ ᴏɴ sʟᴇᴇᴘ. 😴
  </text>

  <!-- Terminal Philosophy Subtitle -->
  <text x="440" y="242" text-anchor="middle" font-family="'Courier New', Courier, 'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="600" fill="#d49b6a" fill-opacity="0.85" letter-spacing="1.4">
    /* Exploring intelligence • Understanding the mathematics • Building what's next */
  </text>
</svg>
