<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="100%" height="100%">
  <defs>
    <!-- Soft Ambient Warm Glow Filter (Light Mode) -->
    <filter id="ambient-fire-blur-light" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
    </filter>

    <!-- Top Gradient Blend for Light Mode: blends the dark video bottom into transparent -->
    <linearGradient id="topVideoBlendGradLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#000000" stop-opacity="0.7"/>
      <stop offset="65%" stop-color="#000000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <!-- Rich Terracotta / Flame Title Gradient -->
    <linearGradient id="fireTitleGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b71c1c"/>
      <stop offset="35%" stop-color="#d84315"/>
      <stop offset="70%" stop-color="#e65100"/>
      <stop offset="100%" stop-color="#ef6c00"/>
    </linearGradient>

    <!-- Soft Divider Gradient -->
    <linearGradient id="fireDividerGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e65100" stop-opacity="0"/>
      <stop offset="30%" stop-color="#e65100" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#d84315" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#e65100" stop-opacity="0"/>
    </linearGradient>

    <!-- Pill Surface Light -->
    <linearGradient id="asciiPillSurfaceLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e65100" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ff8f00" stop-opacity="0.03"/>
    </linearGradient>

    <radialGradient id="fireAmbientLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9800" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ff9800" stop-opacity="0"/>
    </radialGradient>

    <style>
      @keyframes flamePulseLight {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.85); }
      }
      .flame-indicator-light {
        animation: flamePulseLight 2.0s ease-in-out infinite;
        transform-origin: 16px 13px;
      }
    </style>
  </defs>

  <!-- Top Blending Element -->
  <rect x="0" y="0" width="880" height="70" fill="url(#topVideoBlendGradLight)"/>

  <!-- Ambient Flame Radiance -->
  <g filter="url(#ambient-fire-blur-light)">
    <ellipse cx="440" cy="90" rx="260" ry="50" fill="url(#fireAmbientLight)"/>
  </g>

  <!-- Top Telemetry Row (ASCII Terminal Pills) -->
  <g transform="translate(60, 26)">
    <rect x="0" y="0" width="160" height="26" rx="4" fill="url(#asciiPillSurfaceLight)" stroke="#e65100" stroke-width="0.8" stroke-opacity="0.35"/>
    <circle cx="16" cy="13" r="5" fill="#e65100" fill-opacity="0.25" class="flame-indicator-light"/>
    <circle cx="16" cy="13" r="3" fill="#e65100" class="flame-indicator-light"/>
    <text x="28" y="17" font-family="'Courier New', Courier, 'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="9.5" font-weight="700" fill="#bf360c" letter-spacing="1.2">[ SYSTEM // ONLINE ]</text>
  </g>

  <g transform="translate(635, 26)">
    <rect x="0" y="0" width="185" height="26" rx="4" fill="url(#asciiPillSurfaceLight)" stroke="#e65100" stroke-width="0.8" stroke-opacity="0.35"/>
    <text x="92" y="17" text-anchor="middle" font-family="'Courier New', Courier, 'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="9.5" font-weight="700" fill="#c2410c" letter-spacing="0.8">
      [ 📍 CALICUT // BROTOTYPE ]
    </text>
  </g>

  <!-- Hero Name: ASCII Monospace Fire Typography -->
  <text x="440" y="86" text-anchor="middle" font-family="'Courier New', Courier, 'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="31" font-weight="900" fill="url(#fireTitleGradLight)" letter-spacing="4">
    FAYAS P SULFIKKAR
  </text>
  
  <!-- Profile Subtitle -->
  <text x="440" y="109" text-anchor="middle" font-family="'Courier New', Courier, 'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#8d4b1a" letter-spacing="1.8">
    // AI/ML STUDENT &amp; SYSTEMS RESEARCHER • INDEPENDENT BUILDER
  </text>

  <!-- ASCII / Fire Divider -->
  <line x1="120" y1="127" x2="370" y2="127" stroke="url(#fireDividerGradLight)" stroke-width="1.2"/>
  <text x="440" y="131" text-anchor="middle" font-family="'Courier New', Courier, 'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="700" fill="#d84315" letter-spacing="1.5">
    ⟢ EMBER ⟣
  </text>
  <line x1="510" y1="127" x2="760" y2="127" stroke="url(#fireDividerGradLight)" stroke-width="1.2"/>

  <!-- Signature First Impression Bio (Monospace ASCII Style) -->
  <text x="440" y="160" text-anchor="middle" font-family="'Courier New', Courier, 'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="15" font-weight="700" fill="#1c1917" letter-spacing="0.5">
    📉 𝗚𝗿𝗮𝗱𝗶𝗲𝗻𝘁 𝗱𝗲𝘀𝗰𝗲𝗻𝘁 ᴏɴ ᴍʏ ʟɪғᴇ ᴄʜᴏɪᴄᴇs.
  </text>

  <text x="440" y="186" text-anchor="middle" font-family="'Courier New', Courier, 'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="15" font-weight="700" fill="#c2410c" letter-spacing="0.5">
    🎓 ᴀɪ/ᴍʟ sᴛᴜᴅᴇɴᴛ, sᴛɪʟʟ ᴄᴏɴᴠᴇʀɢɪɴɢ.
  </text>

  <text x="440" y="212" text-anchor="middle" font-family="'Courier New', Courier, 'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="15" font-weight="700" fill="#9a3412" letter-spacing="0.5">
    ☕ ᴏᴠᴇʀғɪᴛᴛɪɴɢ ᴏɴ ᴄᴀғғᴇɪɴᴇ, ᴜɴᴅᴇʀғɪᴛᴛɪɴɢ ᴏɴ sʟᴇᴇᴘ. 😴
  </text>

  <!-- Terminal Philosophy Subtitle -->
  <text x="440" y="242" text-anchor="middle" font-family="'Courier New', Courier, 'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="600" fill="#8d4b1a" fill-opacity="0.85" letter-spacing="1.4">
    /* Exploring intelligence • Understanding the mathematics • Building what's next */
  </text>
</svg>
