<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMBER HD // ASCII Room Inferno</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    color: #e6edf3;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  #stage {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: calc(100vh - 52px);
    background: #000000;
  }
  #c {
    display: block;
    image-rendering: pixelated;
    box-shadow: 0 0 60px rgba(255, 90, 0, 0.12);
  }
  #bl {
    display: none;
  }
  #bar {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 52px;
    background: #0d1117;
    border-top: 1px solid #30363d;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    z-index: 100;
  }
  .brand {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: #ff7b00;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .brand span {
    color: #8b949e;
    font-weight: 400;
  }
  .controls {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  button, label.btn {
    background: #161b22;
    color: #c9d1d9;
    border: 1px solid #30363d;
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  button:hover, label.btn:hover {
    background: #21262d;
    color: #f0f6fc;
    border-color: #8b949e;
  }
  button:active, label.btn:active {
    transform: scale(0.97);
  }
  #code {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(8px);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }
  #code.on {
    display: flex;
  }
  .modal {
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 12px;
    width: 90%;
    max-width: 900px;
    height: 80vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
  }
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    border-bottom: 1px solid #30363d;
    font-size: 13px;
    font-weight: 700;
    color: #f0f6fc;
  }
  .modal-header-actions {
    display: flex;
    gap: 8px;
  }
  .modal-body {
    flex: 1;
    overflow: auto;
    padding: 16px;
    background: #010409;
  }
  pre {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 12px;
    line-height: 1.5;
    color: #79c0ff;
    white-space: pre-wrap;
  }
</style>
</head>
<body>

<div id="stage">
  <canvas id="c"></canvas>
  <canvas id="bl"></canvas>
</div>

<div id="bar">
  <div class="brand">
    🔥 EMBER HD <span>// 282×88 ASCII CELLULAR INFERNO</span>
  </div>
  <div class="controls">
    <label class="btn" title="Upload any custom room photo (16:9 recommended)">
      📷 Change Photo
      <input type="file" id="photoUploader" accept="image/*" style="display:none;">
    </label>
    <button id="rp" title="Restart ignition sequence (R)">↺ Reset</button>
    <button id="sc" title="View Simulation Source Code">&lt;/&gt; Source</button>
  </div>
</div>

<div id="code">
  <div class="modal">
    <div class="modal-header">
      <span>EMBER HD // CELLULAR SIMULATION SOURCE</span>
      <div class="modal-header-actions">
        <button id="cp">Copy</button>
        <button id="cl">✕ Close</button>
      </div>
    </div>
    <div class="modal-body">
      <pre><code id="src"></code></pre>
    </div>
  </div>
</div>

  if(ch){chs[o]=ch;cls[o]=col}}
 const mark=(wx,wy,ch,col)=>{const sx=Math.floor((wx-cX-shx)*z+C/2),sy=Math.floor((wy-CY-shy)*z+R/2);if(sx>=0&&sx<C&&sy>=0&&sy<R){chs[sy*C+sx]=ch;cls[sy*C+sx]=col}};
 trail.forEach((p,k)=>mark(p[0],p[1],k>20?'*':k>12?'+':'.',FL_[(8+k*2)|0]));
 P.forEach(p=>{const q=clamp(p.l/p.m,0,1);mark(p.x,p.y,q>.5?'*':'.',FL_[(20+q*40)|0])});
 const fade=1-clamp((t-T_END)/3,0,1),Wp=C*cw;u32.fill(0xff000000);
 for(let o=0;o<C*R;o++){const ch=chs[o];if(!ch)continue;const m=mask(ch),col=cls[o],
   r=((col&255)*fade)|0,g=(((col>>8)&255)*fade)|0,b=(((col>>16)&255)*fade)|0,x0=(o%C)*cw,y0=((o/C)|0)*chh;
  for(let y=0;y<chh;y++){let p=(y0+y)*Wp+x0,q=y*cw;for(let x=0;x<cw;x++,p++,q++){const k=m[q];
   if(k){const e=k+1;u32[p]=0xff000000|((b*e>>8)<<16)|((g*e>>8)<<8)|(r*e>>8)}}}}
 cx.putImageData(img,0,0);bx.clearRect(0,0,bl.width,bl.height);bx.drawImage(cv,0,0,bl.width,bl.height);
}

/* ---------- layout + loop ---------- */
function fit(){const dpr=devicePixelRatio||1,aw=innerWidth*dpr,ah=(innerHeight-52)*dpr;
 cw=clamp(Math.floor(Math.min(aw/C,ah/(R*AS))),3,8);chh=Math.round(cw*AS);   // glyph cell in pixels
 cv.width=C*cw;cv.height=R*chh;bl.width=cv.width>>2;bl.height=cv.height>>2;
 const ar=cv.width/cv.height,w=Math.min(innerWidth,(innerHeight-52)*ar);
 cv.style.width=w+'px';cv.style.height=w/ar+'px';
 img=cx.createImageData(cv.width,cv.height);u32=new Uint32Array(img.data.buffer);
 mk=document.createElement('canvas');mk.width=cw;mk.height=chh;mg=mk.getContext('2d',{willReadFrequently:true});
 mg.font=`${Math.min(cw/.6,chh*.9)}px ui-monospace,Menlo,Consolas,monospace`;mg.textAlign='center';mg.textBaseline='middle';masks.clear();
 zEnd=Math.max(.6,C/(S*UW)*1.04)}
let last=0;
function frame(now){const t=(now-t0)/1000;
 if(t-simT>.5)simT=t-.1;
 while(simT<t){step(simT);simT+=1/30}
 if(now-last>=24){last=now;draw(t)}
 if(t>T_END+3)reset();
 requestAnimationFrame(frame)}
addEventListener('resize',fit);
addEventListener('keydown',e=>{if(e.key==='r'||e.key==='R')reset()});
rp.onclick=reset;
sc.onclick=()=>{src.textContent=document.getElementById('js').textContent;code.classList.add('on')};
cl.onclick=()=>code.classList.remove('on');
cp.onclick=async()=>{try{await navigator.clipboard.writeText(src.textContent);cp.textContent='Copied'}catch(e){cp.textContent='Select and copy'}setTimeout(()=>cp.textContent='Copy',1600)};

// Photo uploader
document.getElementById('photoUploader').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    document.getElementById('photo').textContent = ev.target.result;
    loadPhoto(() => {
      reset();
    });
  };
  reader.readAsDataURL(file);
});

fit();build();loadPhoto(()=>{
  reset();
  requestAnimationFrame(frame);
  window._ready = true;
});

window.renderStepTo = function(targetT) {
  while (simT < targetT) {
    step(simT);
    simT += 1/30;
  }
  draw(targetT);
  return cv.toDataURL('image/jpeg', 0.88);
};
</script>
