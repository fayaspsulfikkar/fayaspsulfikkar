<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="100%" height="100%">
  <defs>
    <!-- Neumorphic Dual Shadows (GitHub Light) -->
    <filter id="neu-card-shadow-l" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur1"/>
      <feOffset in="blur1" dx="8" dy="8" result="offsetDark"/>
      <feFlood flood-color="#d0d7de" flood-opacity="0.85" result="colorDark"/>
      <feComposite in="colorDark" in2="offsetDark" operator="in" result="shadowDark"/>

      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur2"/>
      <feOffset in="blur2" dx="-6" dy="-6" result="offsetLight"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.95" result="colorLight"/>
      <feComposite in="colorLight" in2="offsetLight" operator="in" result="shadowLight"/>

      <feMerge>
        <feMergeNode in="shadowDark"/>
        <feMergeNode in="shadowLight"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neu-pill-shadow-l" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur1"/>
      <feOffset in="blur1" dx="4" dy="4" result="offsetDark"/>
      <feFlood flood-color="#d0d7de" flood-opacity="0.8" result="colorDark"/>
      <feComposite in="colorDark" in2="offsetDark" operator="in" result="shadowDark"/>

      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur2"/>
      <feOffset in="blur2" dx="-3" dy="-3" result="offsetLight"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.95" result="colorLight"/>
      <feComposite in="colorLight" in2="offsetLight" operator="in" result="shadowLight"/>

      <feMerge>
        <feMergeNode in="shadowDark"/>
        <feMergeNode in="shadowLight"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Surfaces matching GitHub Light Mode -->
    <linearGradient id="ghCardSurfaceL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f6f8fa"/>
    </linearGradient>

    <linearGradient id="ghWellSurfaceL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff1f3"/>
      <stop offset="100%" stop-color="#f6f8fa"/>
    </linearGradient>

    <linearGradient id="ghPillSurfaceL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f6f8fa"/>
    </linearGradient>

    <linearGradient id="ghTitleGradL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f2328"/>
      <stop offset="50%" stop-color="#0969da"/>
      <stop offset="100%" stop-color="#8250df"/>
    </linearGradient>

    <clipPath id="wellClipL">
      <rect x="0" y="0" width="960" height="118" rx="20"/>
    </clipPath>

    <style>
      @keyframes pulseLedL {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }
      .led-indicator-l {
        animation: pulseLedL 2.2s ease-in-out infinite;
        transform-origin: 87px 62px;
      }
    </style>
  </defs>

  <!-- Canvas Background matching GitHub Light Mode #ffffff -->
  <rect width="1200" height="450" fill="#ffffff"/>

  <!-- Main Extruded Neumorphic Card -->
  <rect x="36" y="26" width="1128" height="398" rx="26" fill="url(#ghCardSurfaceL)" filter="url(#neu-card-shadow-l)" stroke="#d0d7de" stroke-width="1"/>

  <!-- Top Status Bar -->
  <g transform="translate(68, 48)">
    <rect x="0" y="0" width="158" height="34" rx="17" fill="url(#ghPillSurfaceL)" filter="url(#neu-pill-shadow-l)" stroke="#d0d7de" stroke-width="0.8"/>
    <circle cx="19" cy="17" r="7" fill="#1a7f37" fill-opacity="0.25" class="led-indicator-l"/>
    <circle cx="19" cy="17" r="4" fill="#1a7f37" class="led-indicator-l"/>
    <text x="34" y="21.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1a7f37" letter-spacing="1.2">SYSTEM ONLINE</text>
  </g>

  <g transform="translate(936, 48)">
    <rect x="0" y="0" width="196" height="34" rx="17" fill="url(#ghPillSurfaceL)" filter="url(#neu-pill-shadow-l)" stroke="#d0d7de" stroke-width="0.8"/>
    <text x="98" y="21.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#656d76" letter-spacing="0.8">
      📍 CALICUT &#160;•&#160; BROTOTYPE
    </text>
  </g>

  <!-- Hero Name -->
  <text x="600" y="132" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="url(#ghTitleGradL)" letter-spacing="3">
    FAYAS P SULFIKKAR
  </text>

  <text x="600" y="162" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#656d76" letter-spacing="2">
    AI / ML ENGINEER &#160;•&#160; SYSTEMS RESEARCHER &#160;•&#160; INDEPENDENT BUILDER
  </text>

  <!-- Centerpiece Sunken Debossed Well -->
  <g transform="translate(120, 186)">
    <rect x="0" y="0" width="960" height="118" rx="20" fill="url(#ghWellSurfaceL)" stroke="#afb8c1" stroke-width="1.5"/>

    <!-- Inset Top-Left Dark Shadow -->
    <path d="M 2 20 L 2 2 Q 2 2 20 2 L 940 2" fill="none" stroke="#afb8c1" stroke-width="2.5" opacity="0.8"/>
    <!-- Inset Bottom-Right White Rim -->
    <path d="M 958 98 L 958 116 Q 958 116 940 116 L 20 116" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.95"/>

    <text x="480" y="44" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2328" letter-spacing="0.4">
      📉 𝗚𝗿𝗮𝗱𝗶𝗲𝗻𝘁 𝗱𝗲𝘀𝗰𝗲𝗻𝘁 ᴏɴ ᴍʏ ʟɪғᴇ ᴄʜᴏɪᴄᴇs.
    </text>

    <text x="480" y="73" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#333a42" letter-spacing="0.4">
      🎓 ᴀɪ/ᴍʟ sᴛᴜᴅᴇɴᴛ, sᴛɪʟʟ ᴄᴏɴᴠᴇʀɢɪɴɢ.
    </text>

    <text x="480" y="101" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#656d76" letter-spacing="0.4">
      ☕ ᴏᴠᴇʀғɪᴛᴛɪɴɢ ᴏɴ ᴄᴀғғᴇɪɴᴇ, ᴜɴᴅᴇʀғɪᴛᴛɪɴɢ ᴏɴ sʟᴇᴇᴘ. 😴
    </text>
  </g>

  <!-- Bottom Pills -->
  <g transform="translate(600, 338)">
    <g transform="translate(-465, 0)">
      <rect x="0" y="0" width="220" height="42" rx="21" fill="url(#ghPillSurfaceL)" filter="url(#neu-pill-shadow-l)" stroke="#d0d7de" stroke-width="0.8"/>
      <text x="110" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0969da">
        🧠 Brain Encoding (TRIBE)
      </text>
    </g>

    <g transform="translate(-230, 0)">
      <rect x="0" y="0" width="220" height="42" rx="21" fill="url(#ghPillSurfaceL)" filter="url(#neu-pill-shadow-l)" stroke="#d0d7de" stroke-width="0.8"/>
      <text x="110" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#8250df">
        👁️ Vision WASM (MediaPipe)
      </text>
    </g>

    <g transform="translate(10, 0)">
      <rect x="0" y="0" width="220" height="42" rx="21" fill="url(#ghPillSurfaceL)" filter="url(#neu-pill-shadow-l)" stroke="#d0d7de" stroke-width="0.8"/>
      <text x="110" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1a7f37">
        ⚡ BLE Reverse Engineering
      </text>
    </g>

    <g transform="translate(245, 0)">
      <rect x="0" y="0" width="220" height="42" rx="21" fill="url(#ghPillSurfaceL)" filter="url(#neu-pill-shadow-l)" stroke="#d0d7de" stroke-width="0.8"/>
      <text x="110" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#9a6700">
        📉 Mathematical ML Rigor
      </text>
    </g>
  </g>

  <text x="600" y="408" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#656d76" letter-spacing="2">
    LEARN &#160;•&#160; BUILD &#160;•&#160; FAIL &#160;•&#160; REPEAT &#160;&#160;—&#160;&#160; &quot;MEANING MUST BE BUILT.&quot;
  </text>
</svg>