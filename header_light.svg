<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="100%" height="100%">
  <defs>
    <!-- Neumorphic Dual Shadows (GitHub Light) -->
    <filter id="neu-card-shadow-l" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur1"/>
      <feOffset in="blur1" dx="5" dy="5" result="offsetDark"/>
      <feFlood flood-color="#d0d7de" flood-opacity="0.85" result="colorDark"/>
      <feComposite in="colorDark" in2="offsetDark" operator="in" result="shadowDark"/>

      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur2"/>
      <feOffset in="blur2" dx="-4" dy="-4" result="offsetLight"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.95" result="colorLight"/>
      <feComposite in="colorLight" in2="offsetLight" operator="in" result="shadowLight"/>

      <feMerge>
        <feMergeNode in="shadowDark"/>
        <feMergeNode in="shadowLight"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neu-pill-shadow-l" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur1"/>
      <feOffset in="blur1" dx="2.5" dy="2.5" result="offsetDark"/>
      <feFlood flood-color="#d0d7de" flood-opacity="0.8" result="colorDark"/>
      <feComposite in="colorDark" in2="offsetDark" operator="in" result="shadowDark"/>

      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="blur2"/>
      <feOffset in="blur2" dx="-2" dy="-2" result="offsetLight"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.95" result="colorLight"/>
      <feComposite in="colorLight" in2="offsetLight" operator="in" result="shadowLight"/>

      <feMerge>
        <feMergeNode in="shadowDark"/>
        <feMergeNode in="shadowLight"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Surfaces matching GitHub Light Mode -->
    <linearGradient id="ghCardSurfaceL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f6f8fa"/>
    </linearGradient>

    <linearGradient id="ghWellSurfaceL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff1f3"/>
      <stop offset="100%" stop-color="#f6f8fa"/>
    </linearGradient>

    <linearGradient id="ghPillSurfaceL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f6f8fa"/>
    </linearGradient>

    <linearGradient id="ghTitleGradL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f2328"/>
      <stop offset="40%" stop-color="#24292f"/>
      <stop offset="80%" stop-color="#0969da"/>
      <stop offset="100%" stop-color="#8250df"/>
    </linearGradient>

    <linearGradient id="ghSheenGradL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="wellClipL">
      <rect x="0" y="0" width="800" height="88" rx="14"/>
    </clipPath>

    <style>
      @keyframes pulseLedL {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }
      @keyframes sheenPassL {
        0% { transform: translateX(-300px) skewX(-20deg); }
        35% { transform: translateX(900px) skewX(-20deg); }
        100% { transform: translateX(900px) skewX(-20deg); }
      }

      .led-indicator-l {
        animation: pulseLedL 2.2s ease-in-out infinite;
        transform-origin: 56px 45px;
      }
      .sheen-anim-l {
        animation: sheenPassL 7.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- GitHub Light Canvas -->
  <rect width="880" height="280" fill="#ffffff"/>

  <!-- Main Extruded Neumorphic Card -->
  <rect x="16" y="14" width="848" height="252" rx="18" fill="url(#ghCardSurfaceL)" filter="url(#neu-card-shadow-l)" stroke="#d0d7de" stroke-width="1"/>

  <!-- Top HUD Telemetry -->
  <g transform="translate(38, 31)">
    <rect x="0" y="0" width="138" height="28" rx="14" fill="url(#ghPillSurfaceL)" filter="url(#neu-pill-shadow-l)" stroke="#d0d7de" stroke-width="0.8"/>
    <circle cx="18" cy="14" r="6" fill="#1a7f37" fill-opacity="0.25" class="led-indicator-l"/>
    <circle cx="18" cy="14" r="3.5" fill="#1a7f37" class="led-indicator-l"/>
    <text x="32" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="10" font-weight="700" fill="#1a7f37" letter-spacing="1.1">SYSTEM ONLINE</text>
  </g>

  <g transform="translate(674, 31)">
    <rect x="0" y="0" width="168" height="28" rx="14" fill="url(#ghPillSurfaceL)" filter="url(#neu-pill-shadow-l)" stroke="#d0d7de" stroke-width="0.8"/>
    <text x="84" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="10" font-weight="600" fill="#656d76" letter-spacing="0.8">
      📍 CALICUT &#160;•&#160; BROTOTYPE
    </text>
  </g>

  <!-- Hero Name & Title -->
  <text x="440" y="56" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="28" font-weight="800" fill="url(#ghTitleGradL)" letter-spacing="2.5">
    FAYAS P SULFIKKAR
  </text>
  <text x="440" y="78" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="10.5" font-weight="600" fill="#656d76" letter-spacing="1.5">
    AI / ML ENGINEER &#160;•&#160; SYSTEMS RESEARCHER &#160;•&#160; INDEPENDENT BUILDER
  </text>

  <!-- Centerpiece: Debossed Neumorphic Well for Signature Bio -->
  <g transform="translate(40, 96)">
    <rect x="0" y="0" width="800" height="88" rx="14" fill="url(#ghWellSurfaceL)" stroke="#d0d7de" stroke-width="1.5"/>

    <!-- Inset Top-Left Shadow -->
    <path d="M 2 16 L 2 2 Q 2 2 16 2 L 784 2" fill="none" stroke="#afb8c1" stroke-width="2" opacity="0.6"/>
    <!-- Inset Bottom-Right Light Rim -->
    <path d="M 798 72 L 798 86 Q 798 86 784 86 L 16 86" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>

    <!-- Sheen Pass -->
    <g clip-path="url(#wellClipL)">
      <rect x="0" y="0" width="150" height="88" fill="url(#ghSheenGradL)" class="sheen-anim-l"/>
    </g>

    <!-- Signature Bio Lines -->
    <text x="400" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f2328" letter-spacing="0.3">
      📉 𝗚𝗿𝗮𝗱𝗶𝗲𝗻𝘁 𝗱𝗲𝘀𝗰𝗲𝗻𝘁 ᴏɴ ᴍʏ ʟɪғᴇ ᴄʜᴏɪᴄᴇs.
    </text>
    <text x="400" y="51" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#24292f" letter-spacing="0.3">
      🎓 ᴀɪ/ᴍʟ sᴛᴜᴅᴇɴᴛ, sᴛɪʟʟ ᴄᴏɴᴠᴇʀɢɪɴɢ.
    </text>
    <text x="400" y="74" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#57606a" letter-spacing="0.3">
      ☕ ᴏᴠᴇʀғɪᴛᴛɪɴɢ ᴏɴ ᴄᴀғғᴇɪɴᴇ, ᴜɴᴅᴇʀғɪᴛᴛɪɴɢ ᴏɴ sʟᴇᴇᴘ. 😴
    </text>
  </g>

  <!-- Bottom Four Neumorphic Pills -->
  <g transform="translate(40, 202)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="190" height="32" rx="16" fill="url(#ghPillSurfaceL)" filter="url(#neu-pill-shadow-l)" stroke="#d0d7de" stroke-width="0.8"/>
      <text x="95" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#0969da">
        🧠 Brain Encoding (TRIBE)
      </text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(203, 0)">
      <rect x="0" y="0" width="190" height="32" rx="16" fill="url(#ghPillSurfaceL)" filter="url(#neu-pill-shadow-l)" stroke="#d0d7de" stroke-width="0.8"/>
      <text x="95" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#8250df">
        👁️ Vision WASM (MediaPipe)
      </text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(407, 0)">
      <rect x="0" y="0" width="190" height="32" rx="16" fill="url(#ghPillSurfaceL)" filter="url(#neu-pill-shadow-l)" stroke="#d0d7de" stroke-width="0.8"/>
      <text x="95" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#1a7f37">
        ⚡ BLE Reverse Engineering
      </text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(610, 0)">
      <rect x="0" y="0" width="190" height="32" rx="16" fill="url(#ghPillSurfaceL)" filter="url(#neu-pill-shadow-l)" stroke="#d0d7de" stroke-width="0.8"/>
      <text x="95" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#9a6700">
        📉 Mathematical ML Rigor
      </text>
    </g>
  </g>

  <!-- Bottom Subtitle / Philosophy -->
  <text x="440" y="253" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="600" fill="#656d76" letter-spacing="1.5">
    LEARN &#160;•&#160; BUILD &#160;•&#160; FAIL &#160;•&#160; REPEAT &#160;&#160;—&#160;&#160; &quot;MEANING MUST BE BUILT.&quot;
  </text>
</svg>